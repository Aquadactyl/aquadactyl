# Localhost resolves to this container for server-side requests and to the
# Docker host for browsers. Relay the panel's loopback requests to Wings.
server {
    listen 127.0.0.1:__WINGS_PORT__;
    server_name wings.localhost;
    resolver 127.0.0.11 valid=10s ipv6=off;
    client_max_body_size 100m;

    location / {
        # Resolve on request so panel startup does not depend on Wings startup.
        set $wings_endpoint http://wings:__WINGS_PORT__;
        proxy_pass $wings_endpoint;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 5s;
        proxy_read_timeout 75s;
    }
}
