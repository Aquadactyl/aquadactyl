name: Tests

on:
  pull_request:
    branches:
      - "main"

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        php:
          - "8.4"
          - "8.5"
        database:
          - mariadb:10
          - mariadb:11
          - mysql:8
          - mysql:9
    services:
      database:
        image: ${{ matrix.database }}
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
          MYSQL_DATABASE: testing
        ports:
          - 3306
    steps:
      - uses: actions/checkout@v7
      - id: composer-cache
        run: |
          echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT
      - uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ matrix.php }}-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-${{ matrix.php }}-
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: bcmath, cli, curl, gd, mbstring, mysql, openssl, pdo, tokenizer, xml, zip
          tools: composer:v2
          coverage: none
      - run: cp .env.ci .env
      - run: composer install --no-interaction --no-progress --no-suggest --prefer-dist
      - run: composer audit --locked --no-dev
      - run: vendor/bin/pint --test
        if: matrix.php == '8.4'
      - run: vendor/bin/pest --bootstrap vendor/autoload.php tests/Unit --fail-on-deprecation
        env:
          DB_HOST: UNIT_NO_DB
      # Integration tests render panel views that reference the Vite manifest.
      # The dedicated Build workflow validates the real frontend build, so the PHP
      # matrix only needs a minimal manifest to exercise those views.
      - run: |
          mkdir -p public/build
          printf '%s\n' '{"resources/scripts/index.tsx":{"file":"assets/test.js","src":"resources/scripts/index.tsx","isEntry":true}}' > public/build/manifest.json
      - run: vendor/bin/pest tests/Integration --fail-on-deprecation
        env:
          DB_PORT: ${{ job.services.database.ports[3306] }}
          DB_USERNAME: root
