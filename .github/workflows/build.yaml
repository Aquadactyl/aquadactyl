name: Build

on:
  workflow_dispatch:
  pull_request:
    branches:
      - "main"

jobs:
  ui:
    name: UI
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - name: Code Checkout
        uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod
      - run: pnpm run types
      - run: pnpm run lint
      - run: pnpm run test
      - run: node --test scripts/game-query.test.cjs
      - run: pnpm run build
