name: Release
on:
  push:
    tags:
      - "v*"
jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
      - name: Validate release tag
        run: node scripts/helpers/release-version.mjs "$RELEASE_TAG"
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run types
      - run: pnpm run build
      - name: create release branch and bump version
        run: |
          VERSION="$(node scripts/helpers/release-version.mjs "$RELEASE_TAG")"
          BRANCH="release/$RELEASE_TAG"
          git config --local user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git config --local user.name 'Aquadactyl CI'
          git checkout -b "$BRANCH"
          git push -u origin "$BRANCH"
          sed -i "s/'canary'/'$VERSION'/" config/app.php
          git add config/app.php
          git commit -m 'ci(release): bump version'
          git push
      - name: create release archive
        run: |
          rm -rf node_modules tests CONTRIBUTING.md flake.lock flake.nix phpunit.xml shell.nix
          tar --exclude='bootstrap/cache/*.php' --exclude='storage/logs/*.log' \
            -czf panel.tar.gz * .blueprint .gitattributes .editorconfig .env.example .eslintignore .eslintrc.js .gitignore .oxfmtrc.json .oxlintrc.json .prettierrc.json
          sha256sum panel.tar.gz > SHA256SUMS
      - name: write changelog
        run: |
          sed -n "/^## $RELEASE_TAG/,/^## /{/^## /b;p}" CHANGELOG.md > ./RELEASE_CHANGELOG
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          draft: true
          prerelease: ${{ contains(github.ref_name, 'rc') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') }}
          body_path: ./RELEASE_CHANGELOG
          files: |
            panel.tar.gz
            SHA256SUMS
