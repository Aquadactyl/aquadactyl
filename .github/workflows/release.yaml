name: Release
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. v1.2.3 or 1.2.3)"
        required: true
        type: string
      prerelease:
        description: "Mark as prerelease"
        required: false
        type: boolean
        default: false
jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Resolve release configuration
        id: resolve-release
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="$(echo "$INPUT_VERSION" | xargs)"
            if [[ "$TAG" != v* ]]; then
              TAG="v$TAG"
            fi
            IS_PRERELEASE="$INPUT_PRERELEASE"
          else
            TAG="$GITHUB_REF_NAME"
            if [[ "$TAG" =~ (rc|beta|alpha) ]]; then
              IS_PRERELEASE="true"
            else
              IS_PRERELEASE="false"
            fi
          fi
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"
          echo "IS_PRERELEASE=$IS_PRERELEASE" >> "$GITHUB_ENV"
          echo "release_tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "is_prerelease=$IS_PRERELEASE" >> "$GITHUB_OUTPUT"
      - name: Validate release tag
        run: node scripts/helpers/release-version.mjs "$RELEASE_TAG"
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run types
      - run: pnpm run build
      - name: create release branch and bump version
        run: |
          VERSION="$(node scripts/helpers/release-version.mjs "$RELEASE_TAG")"
          BRANCH="release/$RELEASE_TAG"
          git config --local user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git config --local user.name 'Aquadactyl CI'
          git checkout -b "$BRANCH"
          sed -i "s/'canary'/'$VERSION'/" config/app.php
          git add config/app.php
          git commit -m 'ci(release): bump version'
          git push -u origin "$BRANCH"
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            if [ -z "$(git ls-remote --tags origin "refs/tags/$RELEASE_TAG")" ]; then
              git tag -a "$RELEASE_TAG" -m "Release $RELEASE_TAG"
              git push origin "$RELEASE_TAG"
            fi
          fi
      - name: create release archive
        run: |
          rm -rf node_modules tests CONTRIBUTING.md flake.lock flake.nix phpunit.xml shell.nix
          tar --exclude='bootstrap/cache/*.php' --exclude='storage/logs/*.log' \
            -czf panel.tar.gz * .blueprint .gitattributes .editorconfig .env.example .gitignore .oxfmtrc.json .oxlintrc.json
          sha256sum panel.tar.gz > SHA256SUMS
      - name: write changelog
        run: |
          sed -n "/^## $RELEASE_TAG/,/^## /{/^## /b;p}" CHANGELOG.md > ./RELEASE_CHANGELOG
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          name: ${{ steps.resolve-release.outputs.release_tag }}
          tag_name: ${{ steps.resolve-release.outputs.release_tag }}
          target_commitish: release/${{ steps.resolve-release.outputs.release_tag }}
          draft: false
          prerelease: ${{ steps.resolve-release.outputs.is_prerelease == 'true' }}
          body_path: ./RELEASE_CHANGELOG
          files: |
            panel.tar.gz
            SHA256SUMS
