name: Release
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. v1.2.3 or 1.2.3)"
        required: true
        type: string
      prerelease:
        description: "Mark as prerelease"
        required: false
        type: boolean
        default: false
jobs:
  release:
    concurrency: release-${{ github.ref_name }}
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Resolve release configuration
        id: resolve-release
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="$INPUT_VERSION"
            if [[ "$TAG" != v* ]]; then
              TAG="v$TAG"
            fi
            IS_PRERELEASE="$INPUT_PRERELEASE"
          else
            TAG="$GITHUB_REF_NAME"
            if [[ "$TAG" =~ (rc|beta|alpha) ]]; then
              IS_PRERELEASE="true"
            else
              IS_PRERELEASE="false"
            fi
          fi
          if [[ "$TAG" == *-* ]]; then IS_PRERELEASE=true; fi
          node scripts/helpers/release-version.mjs "$TAG"
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"
          echo "IS_PRERELEASE=$IS_PRERELEASE" >> "$GITHUB_ENV"
          echo "release_tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "is_prerelease=$IS_PRERELEASE" >> "$GITHUB_OUTPUT"
      - name: Validate release tag
        run: node scripts/helpers/release-version.mjs "$RELEASE_TAG"
      - name: Prepare immutable release source
        run: |
          git fetch origin --tags
          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            git checkout --detach "refs/tags/$RELEASE_TAG"
          else
            test "$GITHUB_EVENT_NAME" = workflow_dispatch
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git config user.name 'Aquadactyl CI'
            VERSION="${RELEASE_TAG#v}"
            sed -i "s/    'version' => 'canary',/    'version' => '$VERSION',/" config/app.php
            git add config/app.php
            git commit -m "Release $RELEASE_TAG"
            git tag -a "$RELEASE_TAG" -m "Release $RELEASE_TAG"
            git push origin "refs/tags/$RELEASE_TAG"
          fi
          grep -Fq "    'version' => '${RELEASE_TAG#v}'," config/app.php

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run types
      - run: pnpm run build
      - name: create release archive
        run: |
          rm -rf node_modules tests CONTRIBUTING.md flake.lock flake.nix phpunit.xml shell.nix
          tar --exclude='bootstrap/cache/*.php' --exclude='storage/logs/*.log' \
            -czf panel.tar.gz * .blueprint .gitattributes .editorconfig .env.example .gitignore .oxfmtrc.json .oxlintrc.json
          sha256sum panel.tar.gz > SHA256SUMS
      - name: write changelog
        run: |
          awk -v heading="## $RELEASE_TAG" '$0 == heading { found=1; next } found && /^## / { exit } found { print }' CHANGELOG.md > RELEASE_CHANGELOG
          test -s RELEASE_CHANGELOG
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          name: ${{ steps.resolve-release.outputs.release_tag }}
          tag_name: ${{ steps.resolve-release.outputs.release_tag }}
          target_commitish: ${{ steps.resolve-release.outputs.release_tag }}
          draft: true
          fail_on_unmatched_files: true
          prerelease: ${{ steps.resolve-release.outputs.is_prerelease == 'true' }}
          body_path: ./RELEASE_CHANGELOG
          files: |
            panel.tar.gz
            SHA256SUMS
