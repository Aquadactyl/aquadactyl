name: Deployment checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  deployment:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: useblacksmith/checkout@v1
      - run: shellcheck scripts/helpers/extension-lifecycle.sh tests/Deployment/blueprint-guards.sh tests/Deployment/blueprint-smoke.sh
      - run: bash tests/Deployment/blueprint-guards.sh
