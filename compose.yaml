# Local testing: docker compose up -d --build --wait --wait-timeout 600
name: aquadactyl-test

services:
  database:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: panel
      MARIADB_USER: aquadactyl
      MARIADB_PASSWORD: aquadactyl-local-db
      MARIADB_ROOT_PASSWORD: aquadactyl-local-root
    volumes:
      - database:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30

  cache:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  panel:
    build:
      context: .
      dockerfile: Dockerfile
    image: aquadactyl:test
    restart: unless-stopped
    networks:
      - default
      - servers
    ports:
      - "127.0.0.1:${AQUADACTYL_PORT:-8081}:80"
    depends_on:
      database:
        condition: service_healthy
      cache:
        condition: service_healthy
    volumes:
      - panel-var:/app/var
      - panel-storage:/app/storage
    environment: &panel-environment
      APP_NAME: Aquadactyl
      APP_URL: "http://localhost:${AQUADACTYL_PORT:-8081}"
      APP_ENV: local
      APP_DEBUG: "false"
      APP_ENVIRONMENT_ONLY: "true"
      APP_TIMEZONE: Europe/London
      APP_SERVICE_AUTHOR: admin@aquadactyl.test
      DB_HOST: database
      DB_PORT: "3306"
      DB_DATABASE: panel
      DB_USERNAME: aquadactyl
      DB_PASSWORD: aquadactyl-local-db
      CACHE_STORE: redis
      CACHE_DRIVER: redis
      SESSION_DRIVER: redis
      SESSION_COOKIE: aquadactyl_test_session
      QUEUE_CONNECTION: redis
      QUEUE_DRIVER: redis
      REDIS_HOST: cache
      REDIS_PORT: "6379"
      REDIS_PASSWORD: "null"
      MAIL_MAILER: log
      MAIL_FROM_ADDRESS: noreply@aquadactyl.test
      MAIL_FROM_NAME: Aquadactyl
      SESSION_SECURE_COOKIE: "false"
      SESSION_SAME_SITE: lax
      RECAPTCHA_ENABLED: "false"
      HASHIDS_LENGTH: "8"
      ADDONS_HOOKS_ENABLED: "false"
      AQUADACTYL_LOCAL_SETUP: "true"
      AQUADACTYL_WINGS_PORT: "${AQUADACTYL_WINGS_PORT:-8082}"
      AQUADACTYL_ADMIN_EMAIL: "${AQUADACTYL_ADMIN_EMAIL:-admin@aquadactyl.test}"
      AQUADACTYL_ADMIN_USERNAME: "${AQUADACTYL_ADMIN_USERNAME:-admin}"
      AQUADACTYL_ADMIN_PASSWORD: "${AQUADACTYL_ADMIN_PASSWORD:-AquadactylLocal123!}"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--output", "/dev/null", "http://127.0.0.1/auth/login"]
      interval: 5s
      timeout: 5s
      start_period: 120s
      retries: 30

  wings-setup:
    image: aquadactyl:test
    restart: "no"
    entrypoint: ["php", "/app/.github/docker/local-wings.php"]
    depends_on:
      panel:
        condition: service_healthy
    environment:
      <<: *panel-environment
      AQUADACTYL_SFTP_PORT: "${AQUADACTYL_SFTP_PORT:-2022}"
      AQUADACTYL_GAME_PORTS: "${AQUADACTYL_GAME_PORTS:-25565-25574}"
      AQUADACTYL_WINGS_DATA_ROOT: "${AQUADACTYL_DOCKER_ROOT:-/var/lib/docker}/volumes/${COMPOSE_PROJECT_NAME:-aquadactyl-test}_wings-data/_data"
      AQUADACTYL_WINGS_NETWORK: "${COMPOSE_PROJECT_NAME:-aquadactyl-test}_servers"
    volumes:
      - panel-var:/app/var:ro
      - wings-config:/etc/pterodactyl
      - ./.github/docker/local-wings.php:/app/.github/docker/local-wings.php:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro

  wings:
    build:
      context: .github/docker
      dockerfile: wings.Dockerfile
    image: aquadactyl:wings-test
    restart: unless-stopped
    depends_on:
      wings-setup:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${AQUADACTYL_WINGS_PORT:-8082}:${AQUADACTYL_WINGS_PORT:-8082}"
      - "127.0.0.1:${AQUADACTYL_SFTP_PORT:-2022}:${AQUADACTYL_SFTP_PORT:-2022}"
    environment:
      TZ: Europe/London
      WINGS_UID: "988"
      WINGS_GID: "988"
      WINGS_API_PORT: "${AQUADACTYL_WINGS_PORT:-8082}"
    networks:
      default:
        aliases:
          - wings.localhost
      servers:
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - wings-config:/etc/pterodactyl
      # Wings and its sibling game containers must see the same Docker-host path.
      - "wings-data:${AQUADACTYL_DOCKER_ROOT:-/var/lib/docker}/volumes/${COMPOSE_PROJECT_NAME:-aquadactyl-test}_wings-data/_data"
    healthcheck:
      test: ["CMD", "/usr/local/bin/busybox", "sh", "-c", '/usr/local/bin/busybox nc -z 127.0.0.1 "$$WINGS_API_PORT"']
      interval: 5s
      timeout: 3s
      start_period: 15s
      retries: 30

volumes:
  database:
  panel-var:
  panel-storage:
  wings-config:
  wings-data:
    name: "${COMPOSE_PROJECT_NAME:-aquadactyl-test}_wings-data"

networks:
  servers:
    name: "${COMPOSE_PROJECT_NAME:-aquadactyl-test}_servers"
