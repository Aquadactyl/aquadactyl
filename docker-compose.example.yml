x-common:
  database:
    &db-environment
    MYSQL_PASSWORD: &db-password "CHANGE_ME"
    MYSQL_ROOT_PASSWORD: "CHANGE_ME_TOO"
  panel:
    &panel-environment
    # Change this to the address you use to access Aquadactyl.
    APP_URL: "http://localhost:8080"
    APP_TIMEZONE: "UTC"
    APP_SERVICE_AUTHOR: "noreply@example.com"
    # Uncomment and set this when APP_URL uses HTTPS and the container should
    # request a Let's Encrypt certificate itself.
    # LE_EMAIL: ""
  mail:
    &mail-environment
    MAIL_MAILER: "log"
    MAIL_FROM_ADDRESS: "noreply@example.com"
    MAIL_FROM_NAME: "Aquadactyl"

services:
  database:
    image: mariadb:11
    restart: unless-stopped
    volumes:
      - aquadactyl-database:/var/lib/mysql
    environment:
      <<: *db-environment
      MYSQL_DATABASE: "panel"
      MYSQL_USER: "pterodactyl"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  cache:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  panel:
    build:
      context: .
      dockerfile: Dockerfile
    image: aquadactyl:local
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      database:
        condition: service_healthy
      cache:
        condition: service_healthy
    volumes:
      - aquadactyl-var:/app/var
      - aquadactyl-logs:/app/storage/logs
    environment:
      <<: [*panel-environment, *mail-environment]
      DB_PASSWORD: *db-password
      DB_DATABASE: "panel"
      DB_USERNAME: "pterodactyl"
      DB_HOST: "database"
      DB_PORT: "3306"

      APP_ENV: "production"
      APP_ENVIRONMENT_ONLY: "true"

      CACHE_STORE: "redis"
      CACHE_DRIVER: "redis"
      SESSION_DRIVER: "redis"
      QUEUE_CONNECTION: "redis"
      QUEUE_DRIVER: "redis"
      REDIS_HOST: "cache"
      REDIS_PORT: "6379"
      REDIS_PASSWORD: "null"

      # The example listens over plain HTTP on port 8080.
      SESSION_SECURE_COOKIE: "false"
      SESSION_SAME_SITE: "lax"

      HASHIDS_LENGTH: "8"
      ADDONS_HOOKS_ENABLED: "false"

volumes:
  aquadactyl-database:
  aquadactyl-var:
  aquadactyl-logs:
